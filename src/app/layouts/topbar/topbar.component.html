<nav
	class="sticky top-0 z-[100] flex min-h-14 items-center bg-[var(--c-bg-secondary)] shadow px-5 max-md:fixed max-md:bottom-0 max-md:top-auto max-md:w-full max-md:px-3"
>
	<ul
		class="m-0 flex w-full list-none items-center gap-2 p-0 max-md:justify-between max-md:gap-0"
	>
		<li
			class="inline-flex items-center max-md:flex-1 max-md:justify-center"
		>
			@if (sidebarToggler()) {
			<a
				routerLink="/"
				routerLinkActive="text-[var(--c-primary)]"
				[attr.aria-label]="translateService.translate('Головна')()"
				class="inline-flex items-center rounded-[var(--radius-btn)] px-3 py-2 text-[var(--c-text-secondary)] no-underline transition-colors hover:text-[var(--c-primary)]"
			>
				<img src="/favicon.png" alt="WAW Play" class="block h-9 w-9 rounded-lg" />
			</a>
			} @else {
			<app-nav-icon routerLink="/" icon="home" />
			}
		</li>

		<li class="inline-flex items-center max-md:flex-1 max-md:justify-center">
			<app-nav-icon
				routerLink="/games"
				[name]="translateService.translate('Ігри')()"
				[ariaLabel]="translateService.translate('Ігри')()"
				icon="th-large"
			/>
		</li>

		<li class="inline-flex items-center max-md:flex-1 max-md:justify-center">
			<app-nav-icon
				routerLink="/players"
				[name]="translateService.translate('Гравці')()"
				[ariaLabel]="translateService.translate('Гравці')()"
				icon="users"
			/>
		</li>

		<li class="inline-flex items-center max-md:flex-1 max-md:justify-center">
			<app-nav-icon
				routerLink="/tournaments"
				[name]="translateService.translate('Турніри')()"
				[ariaLabel]="translateService.translate('Турніри')()"
				icon="trophy"
			/>
		</li>

		<li class="inline-flex items-center max-md:flex-1 max-md:justify-center">
			<app-nav-icon
				routerLink="/feed"
				[name]="translateService.translate('Стрічка')()"
				[ariaLabel]="translateService.translate('Стрічка')()"
				icon="images"
			/>
		</li>

		<li class="mx-auto max-md:hidden"></li>

		@if (sidebarToggler()) {
		<li
			class="inline-flex items-center max-md:flex-1 max-md:justify-center"
			(mouseleave)="onBurgerHover(false)"
			(mouseenter)="onBurgerHover(true)"
		>
			<button
				type="button"
				class="inline-flex cursor-pointer items-center justify-center border-0 bg-transparent p-2 text-[1.375rem] leading-none text-[var(--c-text-secondary)] transition-colors hover:text-[var(--c-primary)]"
				(click)="onBurgerClick()"
				[attr.aria-label]="translateService.translate('Menu')()"
			>
				<i class="pi pi-{{ burgerIcon() }}"></i>
			</button>
		</li>
		} @if (showProfile()) {
		<li
			class="inline-flex items-center max-md:flex-1 max-md:justify-center"
		>
			<app-nav-icon icon="user" routerLink="/profile" />
		</li>
		}
	</ul>
</nav>
