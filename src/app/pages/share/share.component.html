<div class="share-page">
	<header class="share-page__hero">
		<h1>{{ title() }}</h1>
		<p>{{ description() }}</p>
	</header>

	<div class="share-page__qr">
		<app-qr-code [value]="shareUrl()" [size]="240" />
	</div>

	<div class="share-page__link">
		<code>{{ shareUrl() }}</code>
		<button pButton type="button" severity="secondary" size="small" (click)="copyLink()">
			<i class="pi pi-copy"></i>
			{{ translateService.translate('Копіювати посилання')() }}
		</button>
	</div>

	@if (kind() === 'app') {
	<a pButton type="button" severity="secondary" size="small" routerLink="/sign">
		<i class="pi pi-user-plus"></i>
		{{ translateService.translate('Зареєструватися')() }}
	</a>
	}
</div>
