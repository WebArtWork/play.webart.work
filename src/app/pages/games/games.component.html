<div class="games-page">
	<h1>Ігри</h1>
	<p class="games-page__intro">Каталог ігор спільноти — знаходьте нові проєкти та стежте за улюбленими.</p>

	@if (games().length) {
		<div class="games-page__grid">
			@for (g of games(); track g._id) {
				<app-game-short [entity]="g" />
			}
		</div>
	} @else {
		<p class="games-page__empty">Ігор поки немає.</p>
	}
</div>
